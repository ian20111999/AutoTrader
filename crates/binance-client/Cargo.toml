[package]
name = "at-binance"
description = "Binance REST API client：HMAC-SHA256 簽名、唯讀端點 ＋ 測試網下單（6.2）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
at-core = { path = "../core" }
at-secrets = { path = "../secret-store" }
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = "3"
