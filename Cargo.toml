[workspace]
resolver = "2"
members = [
    "crates/account-sync",
    "crates/binance-client",
    "crates/core",
    "crates/downloader",
    "crates/engine",
    "crates/secret-store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
