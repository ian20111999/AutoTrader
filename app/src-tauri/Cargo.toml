# 獨立於根目錄的 cargo workspace：不加進 [workspace] members，
# 避免根目錄 `cargo build`/`cargo test` 被牽連（tauri.conf.json 的
# frontendDist 指向 ../dist，沒先跑過 `npm run build` 這個 crate就無法編譯）。
[workspace]

[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
at-core = { path = "../../crates/core" }
at-downloader = { path = "../../crates/downloader" }
at-secrets = { path = "../../crates/secret-store" }
at-market-stream = { path = "../../crates/market-stream" }
at-paper-trading = { path = "../../crates/paper-trading" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
